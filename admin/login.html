<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SV Elegant Interior</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  
  <!-- Supabase SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-core.js"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0b1120 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--admin-card-bg);
      border: 1px solid var(--admin-border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-brand {
      margin-bottom: 24px;
    }
    .login-brand img {
      height: 52px;
      margin-bottom: 12px;
    }
    .login-brand h2 {
      font-size: 1.5rem;
      color: var(--primary-gold);
      font-weight: 700;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .forgot-link {
      display: block;
      font-size: 0.8rem;
      color: var(--primary-gold);
      text-align: right;
      margin-top: 6px;
      cursor: pointer;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <img src="../assets/images/logo.png" alt="SV Elegant Interior Logo">
      <h2>SV Elegant Interior</h2>
      <p>Secure Admin Portal Management</p>
    </div>

    <form id="admin-login-form">
      <div class="form-group" style="text-align: left;">
        <label for="admin-email"><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="admin-email" class="form-control" placeholder="admin@svelegantinteriors.com" required>
      </div>

      <div class="form-group" style="text-align: left;">
        <label for="admin-password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
        <span class="forgot-link" onclick="openForgotModal()">Forgot Password?</span>
      </div>

      <div id="login-alert-box" style="display:none; margin-top:14px; font-size:0.85rem; padding:10px 14px; border-radius:6px; text-align:center;"></div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px; padding: 12px;" id="login-submit-btn">
        <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
      </button>
    </form>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-modal">
    <div class="modal-container" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Reset Admin Password</h3>
        <button class="modal-close" onclick="closeForgotModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px;">
          Enter your authorized admin email address below to receive password recovery instructions.
        </p>
        <div class="form-group">
          <label for="reset-email">Admin Email</label>
          <input type="email" id="reset-email" class="form-control" placeholder="admin@svelegantinteriors.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeForgotModal()">Cancel</button>
        <button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Link</button>
      </div>
    </div>
  </div>

  <script>
    function displayLoginError(msg) {
      const alertBox = document.getElementById('login-alert-box');
      if (alertBox) {
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.border = '1px solid #ef4444';
        alertBox.style.color = '#f87171';
        alertBox.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`;
      }
      if (typeof showAdminToast === 'function') {
        showAdminToast(msg, 'error');
      }
    }

    function displayLoginSuccess(msg) {
      const alertBox = document.getElementById('login-alert-box');
      if (alertBox) {
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
        alertBox.style.border = '1px solid #10b981';
        alertBox.style.color = '#34d399';
        alertBox.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
      }
      if (typeof showAdminToast === 'function') {
        showAdminToast(msg, 'success');
      }
    }

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert-box');
      if (alertBox) alertBox.style.display = 'none';

      const emailInput = document.getElementById('admin-email');
      const passInput = document.getElementById('admin-password');
      const email = emailInput ? emailInput.value.trim() : '';
      const password = passInput ? passInput.value.trim() : '';
      const submitBtn = document.getElementById('login-submit-btn');

      if (!email || !password) {
        displayLoginError('Please enter both admin email and password.');
        return;
      }

      const resetBtn = () => {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Sign In to Dashboard`;
        }
      };

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Authenticating with Supabase...`;
      }

      let db = null;
      try {
        db = getSupabaseClient();
      } catch (e) {
        console.error('Supabase client init error:', e);
      }

      if (!db) {
        displayLoginError('Database client connection error. Please refresh the page.');
        resetBtn();
        return;
      }

      try {
        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Connection timed out. Please check your network.')), 10000)
        );

        const loginPromise = db.auth.signInWithPassword({ email, password });
        const { data, error } = await Promise.race([loginPromise, timeoutPromise]);

        if (error) {
          displayLoginError('Authentication failed: ' + error.message);
          resetBtn();
          return;
        }

        if (data && data.session) {
          displayLoginSuccess('Welcome Admin! Redirecting to Dashboard...');
          setTimeout(() => {
            window.location.href = '/admin/index.html';
          }, 300);
        } else {
          displayLoginError('Login error: Session could not be established.');
          resetBtn();
        }
      } catch (err) {
        displayLoginError('Login error: ' + (err.message || 'Authentication failed'));
        resetBtn();
      }
    });

    function openForgotModal() {
      document.getElementById('forgot-modal').classList.add('active');
    }

    function closeForgotModal() {
      document.getElementById('forgot-modal').classList.remove('active');
    }

    async function sendPasswordReset() {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) {
        showAdminToast('Please enter your admin email.', 'error');
        return;
      }

      try {
        const db = getSupabaseClient();
        const { error } = await db.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/admin/login.html`
        });

        if (error) {
          showAdminToast(error.message, 'error');
        } else {
          showAdminToast('Password reset link sent to ' + email, 'success');
          closeForgotModal();
        }
      } catch (e) {
        showAdminToast('Failed to send reset link.', 'error');
      }
    }
  </script>
</body>
</html>
