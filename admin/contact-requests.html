<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Requests - SV Elegant Interior Admin</title>
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-core.js"></script>
</head>
<body>

  <div class="admin-wrapper">
    <main class="admin-main">
      <div class="admin-content">

        <div class="action-header">
          <div>
            <h3 style="font-size: 1.3rem; font-weight: 700; color: var(--text-main);">Consultation & Quote Inquiries</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">Manage customer lead inquiries submitted from the public website</p>
          </div>
        </div>

        <!-- Filter Controls -->
        <div class="action-header" style="background-color: var(--admin-card-bg); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--admin-border);">
          <div class="search-filter-box">
            <div class="search-input-wrap">
              <i class="fas fa-search"></i>
              <input type="text" id="req-search-input" placeholder="Search customer name or phone..." onkeyup="filterRequests()">
            </div>
            <select id="req-status-filter" class="filter-select" onchange="filterRequests()">
              <option value="all">All Statuses</option>
              <option value="New">New</option>
              <option value="Contacted">Contacted</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <span style="font-size: 0.85rem; color: var(--text-muted);" id="req-count-badge">Total Inquiries: 0</span>
        </div>

        <div class="table-card" style="margin-top: 16px;">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Customer Name</th>
                  <th>Phone Number</th>
                  <th>Service Requested</th>
                  <th>Property Type</th>
                  <th>Submitted Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="req-tbody">
                <tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading customer inquiries...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- View Details Modal -->
  <div class="modal-overlay" id="req-detail-modal">
    <div class="modal-container" style="max-width: 620px;">
      <div class="modal-header">
        <h3>Inquiry Lead Details</h3>
        <button class="modal-close" onclick="closeReqModal()">&times;</button>
      </div>
      <div class="modal-body" id="req-modal-content">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeReqModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    let requestsList = [];

    document.addEventListener('DOMContentLoaded', loadRequests);

    async function loadRequests() {
      const db = getSupabaseClient();
      if (!db) return;

      try {
        const { data, error } = await db.from('contact_requests').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        requestsList = data || [];
        filterRequests();
      } catch (err) {
        showAdminToast('Failed to load inquiries: ' + err.message, 'error');
      }
    }

    function filterRequests() {
      const search = document.getElementById('req-search-input').value.toLowerCase().trim();
      const status = document.getElementById('req-status-filter').value;

      let filtered = requestsList.filter(r => {
        const matchesSearch = r.full_name.toLowerCase().includes(search) || r.phone.toLowerCase().includes(search) || (r.email || '').toLowerCase().includes(search);
        const matchesStatus = status === 'all' || r.status === status;
        return matchesSearch && matchesStatus;
      });

      document.getElementById('req-count-badge').textContent = `Showing ${filtered.length} of ${requestsList.length} inquiries`;
      renderRequestsTable(filtered);
    }

    function renderRequestsTable(items) {
      const tbody = document.getElementById('req-tbody');
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 20px;">No matching quote inquiries found.</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(r => `
        <tr style="${!r.is_read ? 'background-color: rgba(197, 146, 53, 0.05);' : ''}">
          <td><strong>${r.full_name}</strong> ${!r.is_read ? '<span class="badge badge-warning" style="font-size:0.65rem;">NEW</span>' : ''}<br><span style="font-size:0.75rem; color:var(--text-muted);">${r.email || 'No Email'}</span></td>
          <td><a href="tel:${r.phone}" style="color:var(--primary-gold); font-weight:600;"><i class="fas fa-phone-alt"></i> ${r.phone}</a></td>
          <td><span class="badge badge-info">${r.service_required || 'General Inquiry'}</span></td>
          <td>${r.property_type || '-'}</td>
          <td>${new Date(r.created_at).toLocaleString()}</td>
          <td>
            <select class="form-control" style="padding:4px 8px; font-size:0.8rem; width:120px;" onchange="updateRequestStatus('${r.id}', this.value)">
              <option value="New" ${r.status === 'New' ? 'selected' : ''}>New</option>
              <option value="Contacted" ${r.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
              <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Completed" ${r.status === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${r.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </td>
          <td>
            <div class="table-actions">
              <button class="icon-btn" onclick="viewRequestDetails('${r.id}')" title="View Full Details"><i class="fas fa-eye"></i></button>
              <a href="https://wa.me/${r.phone.replace(/[^0-9]/g, '')}?text=Hello%20${encodeURIComponent(r.full_name)},%20this%20is%20SV%20Elegant%20Interior." target="_blank" class="icon-btn" style="color:var(--accent-teal);" title="WhatsApp Customer"><i class="fab fa-whatsapp"></i></a>
              <button class="icon-btn delete" onclick="deleteRequest('${r.id}')" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function viewRequestDetails(id) {
      const r = requestsList.find(item => item.id === id);
      if (!r) return;

      // Mark as read in database
      if (!r.is_read) {
        const db = getSupabaseClient();
        if (db) {
          await db.from('contact_requests').update({ is_read: true }).eq('id', id);
        }
        r.is_read = true;
        updateUnreadCountBadge();
        filterRequests();
      }

      const content = document.getElementById('req-modal-content');
      content.innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;">
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">FULL NAME:</strong><div style="font-size:1rem; font-weight:700;">${r.full_name}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">PHONE NUMBER:</strong><div><a href="tel:${r.phone}" style="color:var(--primary-gold); font-weight:700;">${r.phone}</a></div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">EMAIL ADDRESS:</strong><div>${r.email || 'N/A'}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">SERVICE REQUIRED:</strong><div>${r.service_required || 'General Inquiry'}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">PROPERTY TYPE:</strong><div>${r.property_type || 'N/A'}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">PREFERRED DATE:</strong><div>${r.preferred_date || 'Flexible / Asap'}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">BUDGET RANGE:</strong><div>${r.budget || 'Flexible'}</div></div>
          <div><strong style="color:var(--text-muted); font-size:0.8rem;">SUBMITTED ON:</strong><div>${new Date(r.created_at).toLocaleString()}</div></div>
        </div>
        <div style="margin-top:14px;">
          <strong style="color:var(--text-muted); font-size:0.8rem;">PROJECT ADDRESS / LOCATION:</strong>
          <div style="background:rgba(15,23,42,0.5); padding:10px; border-radius:6px; margin-top:4px;">${r.address || 'N/A'}</div>
        </div>
        <div style="margin-top:14px;">
          <strong style="color:var(--text-muted); font-size:0.8rem;">CUSTOMER MESSAGE:</strong>
          <div style="background:rgba(15,23,42,0.8); padding:14px; border-radius:6px; margin-top:4px; font-style:italic;">"${r.message || 'No additional notes provided.'}"</div>
        </div>
      `;

      document.getElementById('req-detail-modal').classList.add('active');
    }

    function closeReqModal() {
      document.getElementById('req-detail-modal').classList.remove('active');
    }

    async function updateRequestStatus(id, newStatus) {
      const db = getSupabaseClient();
      if (!db) return;
      try {
        const { error } = await db.from('contact_requests').update({ status: newStatus }).eq('id', id);
        if (error) throw error;
        const r = requestsList.find(item => item.id === id);
        if (r) r.status = newStatus;
        await logAdminActivity('Updated Inquiry Status', 'Contact Requests', id, `Status: ${newStatus}`);
        showAdminToast(`Status changed to ${newStatus}`, 'success');
      } catch (err) {
        showAdminToast('Failed to update status: ' + err.message, 'error');
      }
    }

    function deleteRequest(id) {
      confirmAction('Delete Inquiry', 'Are you sure you want to delete this customer request?', async () => {
        const db = getSupabaseClient();
        if (!db) return;
        try {
          const { error } = await db.from('contact_requests').delete().eq('id', id);
          if (error) throw error;
          await logAdminActivity('Deleted Inquiry', 'Contact Requests', id, '');
          showAdminToast('Inquiry deleted!', 'success');
          await loadRequests();
        } catch (e) {
          showAdminToast('Error deleting inquiry: ' + e.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
